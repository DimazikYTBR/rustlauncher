[package]
name = "rustlauncher"
version = "0.1.0"
edition = "2021"
description = "RustLauncher — лёгкий нативный лаунчер Minecraft (egui + glow)"

[dependencies]
# GUI: только OpenGL (glow) — без wgpu/Vulkan, подходит для старых видеокарт (OpenGL 3.3)
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
# Асинхронность и сеть
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "sync", "io-util", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
futures = "0.3"
# Сериализация
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Хеши и архивы
sha1 = "0.10"
hex = "0.4"
md5 = "0.7"
zip = { version = "2", default-features = false, features = ["deflate"] }
# Утилиты
anyhow = "1"
dirs = "5"
rfd = "0.15"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
